# Your news lineup. Segments play in the order listed here.
# Set enabled = false to drop a source, or reorder blocks to change the order.
# max_age_hours: skip a source if its newest episode is older than this
# (keeps you from hearing yesterday's news from a source that hasn't updated).

[settings]
title = "Your News Briefing"
voice = "en-US-AriaNeural"   # voice for the short spoken intros (Microsoft Edge neural voices)
intros = true                # say "Next, from NPR..." between segments
timezone = "America/New_York"

[[source]]
name = "NPR News Now"
feed = "https://feeds.npr.org/500005/podcast.xml"
enabled = true
max_age_hours = 6

